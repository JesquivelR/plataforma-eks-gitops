# Clúster kind para probar la plataforma en local.
# El nodo de control expone los puertos 80 y 443 del host para el ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: plataforma
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
