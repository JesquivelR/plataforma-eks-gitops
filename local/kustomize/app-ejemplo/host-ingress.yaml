apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-demo
  namespace: demo
spec:
  rules:
    - host: demo.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-demo
                port:
                  name: http
