apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-demo
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    # Secret de Kubernetes que consume el Deployment.
    name: app-demo-config
    creationPolicy: Owner
  data:
    # Ejemplo: secreto de Secrets Manager llamado eks-gitops-dev/app-demo con una propiedad
    # JSON "api_token". Debe empezar con el prefijo que
    # permite el rol IRSA (variable nombre del entorno).
    - secretKey: API_TOKEN
      remoteRef:
        key: eks-gitops-dev/app-demo
        property: api_token
