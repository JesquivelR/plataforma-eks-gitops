apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: predeterminada
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  # Rol IAM de los nodos (salida rol_nodos_karpenter de Terraform).
  role: <NOMBRE_ROL_NODOS>
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-gitops-dev-cluster
  # EKS etiqueta su grupo de seguridad primario con el nombre del clúster.
  securityGroupSelectorTerms:
    - tags:
        aws:eks:cluster-name: eks-gitops-dev-cluster
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
