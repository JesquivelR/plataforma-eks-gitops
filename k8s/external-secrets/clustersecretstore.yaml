apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    # Va después del chart de External Secrets Operator (sync-wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # Sin llaves estáticas: usa el rol IRSA anotado en la cuenta de servicio
        # del controlador (módulo eso-irsa de Terraform).
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
