# Aplicación raíz (app-of-apps): Argo CD sincroniza todo lo que haya en k8s/argocd/apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JesquivelR/plataforma-eks-gitops.git
    targetRevision: main
    path: k8s/argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
